<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightSteps - NCDC Medina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-page">
        <div style="max-width: 420px; margin: 80px auto; background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;">
            <h1 style="color: var(--dark-green);">🌱 BrightSteps</h1>
            <p style="color: #555; margin: 1.5rem 0;">National Child Development Center - Medina</p>
            
            <h2 style="margin: 2rem 0 1rem;">Login as</h2>
            
            <button onclick="loginAs('teacher')" class="btn" style="width: 100%; margin-bottom: 15px; padding: 14px;">
                👩‍🏫 Teacher / Faculty
            </button>
            
            <button onclick="loginAs('parent')" class="btn btn-blue" style="width: 100%; padding: 14px;">
                👨‍👩‍👧 Parent
            </button>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <!-- Header and Sidebar will be injected here -->
    </div>

    <script src="app.js"></script>
</body>
</html>
